<!-- Brainstorm companion fragment (2026-10-01): duotone style B, window opening B (inward). Spec: docs/superpowers/specs/2026-10-01-oikos-device-icons-design.md -->
<h2>Device icons: motion (final)</h2>
<p class="subtitle">The shutter now rolls (slats and bottom rail travel together out of the roller box), and the door handle is attached to the leaf. Try the buttons again.</p>

<style>
  .stage { display:flex; gap:14px; flex-wrap:wrap; padding:20px; border-radius:16px;
           background:linear-gradient(180deg,#1D2B55,#0B1020); }
  .tile { width:150px; padding:14px; border-radius:18px; background:rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.09); color:#E8ECFF; font-family:system-ui,sans-serif; transition:border-color .45s; }
  .tile.alert { border-color:rgba(255,196,87,.35); }
  .tile svg { width:56px; height:56px; display:block; overflow:visible; }
  .tile .n { margin-top:10px; font-size:12px; opacity:.72; }
  .tile .v { font-size:15px; font-weight:600; min-height:20px; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .btns button { font:12px system-ui; padding:4px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.2);
                 background:rgba(255,255,255,.08); color:#E8ECFF; cursor:pointer; }
  .ln { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .fl { fill:currentColor; fill-opacity:.22; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; }
  .open-tint { color:#FFC457; } .closed-tint { color:#6FF0BF; }

  /* Shutter: one curtain drawn fully closed, translated up by the open fraction. */
  #curtain { transition:transform 1.4s cubic-bezier(.45,0,.55,1); }

  /* Door: leaf and handle morph with the same timing, from the same affine positions. */
  .swing { transition:d .5s cubic-bezier(.3,.7,.2,1), color .5s; }
  #leaf   { d:path("M6 3L18 3L18 21L6 21Z"); }
  #handle { d:path("M15.6 12.9L13.6 12.9"); }
  #door.open #leaf   { d:path("M6 3L13.5 5.5L13.5 21.5L6 21Z"); }
  #door.open #handle { d:path("M12 14L10.75 13.77"); }
  #sash { d:path("M4 3L12 3L12 21L4 21Z"); }
  #win.open #sash { d:path("M4 3L8.5 1L8.5 23L4 21Z"); }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="stage">
  <div class="tile">
    <svg viewBox="0 0 24 24">
      <defs><clipPath id="opening"><rect x="3.5" y="6.5" width="17" height="14.5"/></clipPath></defs>
      <rect class="ln" x="3.5" y="3" width="17" height="18" rx="2"/>
      <g clip-path="url(#opening)">
        <g id="curtain" style="transform:translateY(-9px)">
          <rect x="3.5" y="6.5" width="17" height="14.5" fill="currentColor" fill-opacity=".22"/>
          <g class="ln" style="stroke-width:1;opacity:.75"><path d="M3.5 9h17M3.5 11.5h17M3.5 14h17M3.5 16.5h17M3.5 19h17"/></g>
          <path class="ln" d="M4.2 20.6h15.6" style="stroke-width:1.8"/>
        </g>
      </g>
      <path class="fl" d="M3.5 5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v1.5h-17z" style="fill-opacity:.35"/>
    </svg>
    <div class="n">Living room shutter</div>
    <div class="v" id="sh-v">60 %</div>
    <div class="btns"><button onclick="sh(0)">Close</button><button onclick="sh(60)">60 %</button><button onclick="sh(100)">Open</button></div>
  </div>

  <div class="tile" id="door">
    <svg viewBox="0 0 24 24">
      <path class="ln" d="M6 21V3h12v18M4 21h16"/>
      <path class="fl swing closed-tint" id="leaf"/>
      <path class="ln swing" id="handle" style="stroke-width:1.9;color:#E8ECFF"/>
    </svg>
    <div class="n">Front door</div>
    <div class="v" id="door-v">Closed</div>
    <div class="btns"><button onclick="flip('door','door-v','leaf')">Open / close</button></div>
  </div>

  <div class="tile" id="win">
    <svg viewBox="0 0 24 24">
      <rect class="ln" x="4" y="3" width="16" height="18" rx="1.5"/>
      <path class="fl" d="M12 3h8v18h-8z" style="color:#E8ECFF;fill-opacity:.1"/>
      <path class="ln" d="M12 12h8"/>
      <path class="fl swing closed-tint" id="sash"/>
    </svg>
    <div class="n">Bedroom window</div>
    <div class="v" id="win-v">Closed</div>
    <div class="btns"><button onclick="flip('win','win-v','sash')">Open / close</button></div>
  </div>
</div>

<script>
  function sh(p){ document.getElementById('curtain').style.transform='translateY(-'+(14.5*p/100)+'px)';
    document.getElementById('sh-v').textContent = p===0?'Closed':p===100?'Open':p+' %'; }
  function flip(id,vid,partId){ var t=document.getElementById(id), o=t.classList.toggle('open');
    var part=document.getElementById(partId); part.classList.toggle('open-tint',o); part.classList.toggle('closed-tint',!o);
    t.classList.toggle('alert',o); document.getElementById(vid).textContent=o?'Open':'Closed'; }
</script>
