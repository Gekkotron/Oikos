org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Skip the configuration phase on repeat invocations (Gradle has been nagging about this
# on every CI run). Several plugins used here (Hilt KSP, Firebase, aboutlibraries) have
# historically been CC-unfriendly, so this is monitored by `--configuration-cache-problems=warn`
# at the CI call site; move to `fail` once we're clean.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
kotlin.code.style=official
android.useAndroidX=true
