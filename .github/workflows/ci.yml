name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.group.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            tasks: >-
              :core:model:test
              :core:crypto:test
              :core:transport:test
              :core:state:test
              :core:source:test
              :core:voice:test
              :core:data:test
              :core:alerts:test
              :core:history:test
              :core:push:test
              :core:demo:test
              :core:designsystem:test
              koverXmlReport
          - name: feature
            tasks: >-
              :feature:home:test
              :feature:onboarding:test
              :feature:energy:test
              :feature:history:test
              :feature:security:test
              :feature:settings:test
              :feature:alerts:test
              :feature:widget:test
              :feature:voice:test
              koverXmlReport
          - name: app
            tasks: >-
              :app:test
              :app:assembleDebug
              koverXmlReport
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: ${{ matrix.group.name }} tests
        # Configuration cache is enabled in gradle.properties for local dev speed, but we
        # disable it on CI with -Dorg.gradle.configuration-cache=false: the :app job's
        # Hilt KSP + Compose UI + Robolectric combo hangs the invocation under CC in CI
        # even though it stores a cache entry cleanly on a dev machine. Revisit when AGP /
        # Hilt / KSP CC compatibility improves.
        run: ./gradlew ${{ matrix.group.tasks }} -Dorg.gradle.configuration-cache=false --stacktrace --continue
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: ${{ matrix.group.name }}
          fail_ci_if_error: false
      - name: Upload debug APK
        if: matrix.group.name == 'app' && success()
        uses: actions/upload-artifact@v4
        with:
          name: oikos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
