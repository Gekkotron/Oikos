name: Build & upload to Firebase App Distribution

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Increase app version
        run: ./gradlew increaseBuildNumber -PversionCode=$GITHUB_RUN_NUMBER

      - name: Prepare signing config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/oikos-release.jks"
          umask 077
          cat > app/signing.properties <<EOF
          storeFile=$RUNNER_TEMP/oikos-release.jks
          keyAlias=$SIGNING_ALIAS
          storePassword=$SIGNING_PASSWORD
          keyPassword=$SIGNING_PASSWORD
          EOF

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: Testers
          file: app/build/outputs/apk/release/app-release.apk

      - name: Commit updated version code
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Gekkotron
          author_email: 60887050+Gekkotron@users.noreply.github.com
          message: "Update version code"
          add: "app/version.properties"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
